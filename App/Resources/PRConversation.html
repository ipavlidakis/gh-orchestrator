<!doctype html>
<html lang="en">
<head>

<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }

.markdown-body h2 { font-size: 20px; }
.markdown-body h3 { font-size: 17px; }
.markdown-body h4, .markdown-body h5, .markdown-body h6 { font-size: 14px; }

.markdown-body ul, .markdown-body ol { padding-left: 26px; }

.pl-c { color: var(--secondary); }
.pl-k, .pl-smi, .pl-ent { color: var(--red); }

.pl-en, .pl-c1, .pl-bu { color: var(--purple); }

.expand { margin-left: auto; }

.avatar { display: block; position: relative; width: 28px; overflow: visible; color: var(--secondary); text-decoration: none; border: .5px solid var(--border); }
.avatar img { width: 28px; height: 28px; object-fit: cover; position: absolute; inset: 0; }
.author { font-weight: 600; }

.pr-subtitle .author { color: var(--text); }
.branch { color: var(--secondary); text-decoration: none; overflow-wrap: anywhere; }
.edit-summary { color: var(--secondary); width: 28px; height: 28px; flex: 0 0 28px; }

.commit-sha { color: var(--secondary); white-space: nowrap; }
.icon { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.5; }

.avatar img { border-radius: 50%; }
.resolved-badge { position: absolute; z-index: 2; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--background); background: var(--status-success); color: var(--background); font: 600 9px/10px -apple-system, sans-serif; }
article.timeline { display: block; padding: 0; }
.timeline > header { gap: 8px; }
.timeline > .markdown-body, .timeline > footer { margin-left: 36px; }
article.thread .disclosure-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }

.conversation-part .comment-author { display: flex; gap: 8px; padding: 16px 12px 8px; align-items: center; font-size: 12px; }
.comment-author .author { color: var(--text); }

.external-link { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex: 0 0 24px; margin-left: auto; color: var(--secondary); text-decoration: none; border-radius: 5px; }
.external-link:hover { background: var(--rail); color: var(--text); }
.thread-state { position: relative; color: var(--secondary); font-size: 11px; pointer-events: none; white-space: nowrap; }
.comment-card > footer.thread-actions { margin: 0; padding: 12px; border-top: .5px solid var(--border); background: var(--rail); }
.thread-actions .reply { flex: 1; padding: 8px 12px; text-align: left; border: .5px solid var(--border); border-radius: 6px; background: var(--card); }
.thread-actions .resolve { padding: 6px 12px; border: .5px solid var(--border); border-radius: 6px; }
.thread-actions .resolve { color: var(--text); }
.reactions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 4px 8px 12px; font-size: 12px; }
.conversation-part .reactions { padding-left: 48px; }
.reaction { min-width: 30px; min-height: 28px; padding: 3px 8px; border: .5px solid var(--border); border-radius: 999px; color: var(--text); }
.reaction[aria-pressed=true] { background: var(--branch); border-color: var(--link); }
button:disabled { cursor: default; opacity: .55; }
.reaction-picker { display: flex; gap: 4px; flex-wrap: wrap; flex-basis: 100%; }
</style>
</head>

        container.append(body);
        if (row.id === "summary" && row.canEditDescription) {
            const actions = element("div", "description-actions");
            const edit = button("Edit description", "edit-description", function () { post({kind: "edit-text"}); });
            edit.disabled = row.isUpdatingDescription;
            actions.append(edit); container.append(actions);
        }
        if (!body.hidden && !row.isSummary && row.kind !== "review") appendReactions(container, row);
        if (body.querySelector("math-renderer,.js-render-needs-enrichment")) container.append(element("p", "enrichment-note", "Math and diagrams can be viewed on GitHub."));
        if (container !== node) node.append(container);
        return node;
    }

    function configureDescriptionTasks(body, row) {
        const inputs = Array.from(body.querySelectorAll('input[type="checkbox"]'));
        const tasks = row.descriptionTasks || [];
        const matched = inputs.length === tasks.length && inputs.every((input, index) => input.closest(".task-list-item") && input.checked === tasks[index].checked);
        if (!matched) return;
        body.tabIndex = -1;
        body.setAttribute("aria-busy", String(row.isUpdatingDescription));
        inputs.forEach(function (input, index) {
            const task = tasks[index];
            input.disabled = !row.canEditDescription || row.isUpdatingDescription;
            input.dataset.taskOffset = String(task.offset);
            input.setAttribute("aria-label", input.closest("li").textContent.trim());
            if (pendingTask && row.isUpdatingDescription && pendingTask.offset === task.offset) input.checked = pendingTask.checked;
            input.title = row.canEditDescription ? "Save this task on GitHub" : "You cannot edit this pull request description";
            input.addEventListener("change", function () {
                pendingTask = { offset: task.offset, checked: input.checked };
                inputs.forEach(control => { control.disabled = true; });
                body.setAttribute("aria-busy", "true"); body.focus({preventScroll: true});
                post({kind: "description-task", offset: String(task.offset), checked: String(input.checked), body: row.body});
            });
        });
    }

    const reactionTypes = { THUMBS_UP: ["👍", "Thumbs up"], THUMBS_DOWN: ["👎", "Thumbs down"], LAUGH: ["😄", "Laugh"], HOORAY: ["🎉", "Hooray"], CONFUSED: ["😕", "Confused"], HEART: ["❤️", "Heart"], ROCKET: ["🚀", "Rocket"], EYES: ["👀", "Eyes"] };
    function appendReactions(container, row) {
        const groups = (row.reactionGroups || []).filter(group => reactionTypes[group.content] && group.reactors.totalCount > 0);
        if (!row.canReact && !groups.length) return;
        const toolbar = element("div", "reactions");
        toolbar.tabIndex = -1;
        toolbar.setAttribute("role", "group"); toolbar.setAttribute("aria-label", "Comment reactions");
        function reaction(content, count) {
            const [emoji, label] = reactionTypes[content], selected = (row.reactionGroups || []).some(group => group.content === content && group.viewerHasReacted);
            const control = button(emoji + (count == null ? "" : " " + count), "reaction", function () {
                toolbar.focus({preventScroll: true});
                toolbar.querySelectorAll("button").forEach(button => { button.disabled = true; });
                post({kind: "reaction", id: row.id, content});
            });
            control.setAttribute("aria-label", (selected ? "Remove " : "Add ") + label + " reaction" + (count == null ? "" : ", " + count));
            control.setAttribute("aria-pressed", String(selected)); control.title = label;
            control.disabled = !row.canReact || row.isReacting;
            return control;
        }
        for (const group of groups) toolbar.append(reaction(group.content, group.reactors.totalCount));
        if (row.canReact) {
            const picker = element("div", "reaction-picker"); picker.hidden = true;
            for (const content of Object.keys(reactionTypes)) picker.append(reaction(content));
            const add = button("", "reaction add-reaction", function () {
                picker.hidden = !picker.hidden; add.setAttribute("aria-expanded", String(!picker.hidden));
                if (!picker.hidden) picker.querySelector("button").focus();
            });
            add.innerHTML = '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M5 9c1 3 5 3 6 0M5.5 5.5h.5m4 0h.5"/></svg>';
            add.setAttribute("aria-label", "Add reaction"); add.setAttribute("aria-expanded", "false"); add.disabled = row.isReacting;
            toolbar.addEventListener("keydown", function (event) {
                if (event.key === "Escape") { picker.hidden = true; add.setAttribute("aria-expanded", "false"); add.focus(); event.stopPropagation(); }
            });
            toolbar.append(add, picker);
        }
        container.append(toolbar);
    }

    function makeThreadComment(row) {
        const first = row.kind === "thread", open = !first || expanded.has(row.id);
        const node = element("article", "card conversation-part " + row.kind + (open ? " expanded" : ""));
        node.dataset.rowId = row.id;
        const depth = depths.get(first ? row.id : row.parentID) || 0;
        node.style.left = "calc(var(--gutter) + " + depth * 24 + "px)";
        const container = element("div", "comment-card" + (first ? " thread-start" : "") + ((!open || row.isThreadEnd) ? " thread-end" : ""));
        if (first) {
            if (!open) node.append(avatar(row));
            const header = element("header", "disclosure-header");
            const disclosure = button("", "disclosure", () => toggle(row.id));
            disclosure.setAttribute("aria-expanded", String(open)); disclosure.setAttribute("aria-label", row.title + " " + row.subtitle); disclosure.setAttribute("aria-controls", "content-" + row.id);
            const title = element("div", "disclosure-title", row.filePath); title.title = row.filePath;
            header.append(disclosure, element("span", "chevron"), title, element("span", "thread-state", row.badgeResolved ? (row.isResolved ? "Resolved" : "Outdated") : "Open"));
            if (row.childCount) header.append(element("span", "child-count", row.childCount + (row.childCount === 1 ? " reply" : " replies")));
            container.append(header);
        }
        const body = element("div", "markdown-body"); body.id = "content-" + row.id; body.hidden = !open;
        if (open) {
            const author = element("div", "comment-author");
            const date = link(row.time, row.url, "comment-date"); date.dataset.external = "true";
            author.append(avatar(row), link(row.title, row.author && row.author.url, "author"), date);
            if (row.url) author.append(externalLink(row));
            container.append(author);
            if (row.bodyHTML != null) body.append(sanitize(row.bodyHTML)); else if (row.body) body.append(element("pre", "raw-markdown", row.body));
        }
        container.append(body);
        if (open) {
            if (body.querySelector("math-renderer,.js-render-needs-enrichment")) container.append(element("p", "enrichment-note", "Math and diagrams can be viewed on GitHub."));
            appendReactions(container, row);
            if (row.isThreadEnd) {
                const footer = element("footer", "thread-actions");
                if (row.hasMoreReplies) footer.append(button("Load more replies", "", () => post({kind: "replies", id: row.threadID})));
                if (row.canReply) footer.append(button("Reply…", "reply", () => post({kind: "reply", id: row.threadID})));
                if (row.canResolve) footer.append(button(row.isResolved ? "Unresolve conversation" : "Resolve conversation", "resolve", () => post({kind: "resolve", id: row.threadID})));
                if (footer.childNodes.length) container.append(footer);
            }
        }
        node.append(container); return node;
    }
    const observer = new ResizeObserver(function (entries) {
        for (const entry of entries) {
            const node = entry.target;
            if (!node.isConnected) continue;
            const id = node.dataset.rowId;
            const box = entry.borderBoxSize && entry.borderBoxSize[0];
            pendingHeights.set(id, Math.ceil(box ? box.blockSize : node.getBoundingClientRect().height));
        }
        if (!measurementFrame) measurementFrame = requestAnimationFrame(function () {
            measurementFrame = 0;
            const saved = anchor();
            let changed = false;
            for (const [id, height] of pendingHeights) {
                if (indices.has(id) && height > 0 && heights.get(id) !== height) { heights.set(id, height); changed = true; }
            }
            pendingHeights.clear();
            if (changed) { rebuild(); restore(saved); schedule(); }
        });
    });
    function render() {
        if (!rows.length) return;
        const start = indexAt(Math.max(0, window.scrollY - 600));
        const end = Math.min(rows.length - 1, indexAt(window.scrollY + window.innerHeight + 600));
        const focused = document.activeElement && document.activeElement.closest("article");
        for (const [id, node] of mounted) {
            const index = indices.get(id);
            if ((index < start || index > end) && node !== focused) { observer.unobserve(node); node.remove(); mounted.delete(id); }
        }
        for (let i = start; i <= end; i++) {
            const row = rows[i];
            if (!mounted.has(row.id)) {
                const node = makeRow(row);
                node.style.top = offsets[i] + "px";
                // Keep DOM order chronological for keyboard navigation and accessibility.
                let before = null;
                for (const child of canvas.children) if (indices.get(child.dataset.rowId) > i) { before = child; break; }
                canvas.insertBefore(node, before);
                mounted.set(row.id, node);
                observer.observe(node);
            }
        }
    }
    window.prConversation = {
        setRows: function (next) {
            const saved = anchor(), previous = new Map(allRows.map(function (row) { return [row.id, row]; })), previousDepths = depths;
            const reactionFocus = document.activeElement?.closest(".reactions")?.closest("article")?.dataset.rowId;
            allRows = next;
            const completedTask = pendingTask && !next.find(row => row.id === "summary")?.isUpdatingDescription ? pendingTask : null;
            if (completedTask) pendingTask = null;
            byID = new Map(allRows.map(function (row) { return [row.id, row]; }));
            for (const row of allRows) {
                const before = previous.get(row.id);
                if (!before || before.defaultExpanded !== row.defaultExpanded) {
                    if (row.defaultExpanded) expanded.add(row.id);
                    else expanded.delete(row.id);
                }
            }
            depths = new Map();
            for (const row of allRows) depths.set(row.id, row.parentID ? (depths.get(row.parentID) || 0) + 1 : 0);
            const changed = new Set(allRows.filter(row => !same(previous.get(row.id), row) || previousDepths.get(row.id) !== depths.get(row.id)).map(row => row.id));
            // Keep the document height until the replacement summary is measured, so scroll restoration cannot clamp it.
            for (const id of heights.keys()) if (!byID.has(id) || (changed.has(id) && id !== "summary")) heights.delete(id);
            for (const id of pendingHeights.keys()) if (!byID.has(id) || changed.has(id)) pendingHeights.delete(id);
            for (const id of expanded) if (!byID.has(id)) expanded.delete(id);
            for (const [id, node] of mounted) if (!byID.has(id) || changed.has(id)) {
                observer.unobserve(node); node.remove(); mounted.delete(id);
            }
            // A later activity page can supply the review for an already open conversation.
            for (const row of allRows) {
                const before = previous.get(row.id);
                if (!before || before.parentID === row.parentID || (!expanded.has(row.id) && saved?.id !== row.id)) continue;
                let parent = byID.get(row.parentID);
                while (parent) {
                    expanded.add(parent.id); heights.delete(parent.id);
                    const node = mounted.get(parent.id);
                    if (node) { observer.unobserve(node); node.remove(); mounted.delete(parent.id); }
                    parent = byID.get(parent.parentID);
                }
            }
            visibleRows(); restore(saved); render();
            if (reactionFocus) {
                const toolbar = mounted.get(reactionFocus)?.querySelector(".reactions");
                (toolbar?.querySelector(".add-reaction:not(:disabled)") || toolbar)?.focus({preventScroll: true});
            }
            if (completedTask) mounted.get("summary")?.querySelector('input[data-task-offset="' + completedTask.offset + '"]:not(:disabled)')?.focus({preventScroll: true});
        },
        setTheme: function (colors, dark) {
            for (const [key, value] of Object.entries(colors)) document.documentElement.style.setProperty("--" + key, value);
            document.documentElement.style.colorScheme = dark ? "dark" : "light";
        },
        focus: function (id) {
            if (!byID.has(id)) return;
            let row = byID.get(id), changed = false;
            while (row) {
                if (!row.isSummary && !expanded.has(row.id)) {
                    expanded.add(row.id); heights.delete(row.id); changed = true;
                    const node = mounted.get(row.id);
                    if (node) { observer.unobserve(node); node.remove(); mounted.delete(row.id); }
                }
                row = byID.get(row.parentID);
            }
            if (changed) visibleRows();
            window.scrollTo(0, Math.max(0, offsets[indices.get(id)] - 12));
            render();
            let measured = false;
            for (const [rowID, node] of mounted) {
                const height = node.getBoundingClientRect().height;
                if (height > 0 && heights.get(rowID) !== height) {
                    heights.set(rowID, height); pendingHeights.delete(rowID); measured = true;
                }
            }
            if (measured) {
                rebuild();
                window.scrollTo(0, Math.max(0, offsets[indices.get(id)] - 12));
                render();
            }
        }
    };
    window.addEventListener("scroll", schedule, { passive: true });
    window.addEventListener("resize", function () {
        if (width === canvas.clientWidth) return;
        const saved = anchor();
        width = canvas.clientWidth;
        heights.clear(); pendingHeights.clear();
        rebuild(); restore(saved); schedule();
    });
    document.addEventListener("click", function (event) {
        for (const toolbar of document.querySelectorAll(".reactions")) if (!toolbar.contains(event.target)) {
            const picker = toolbar.querySelector(".reaction-picker"), add = toolbar.querySelector(".add-reaction");
            if (picker) picker.hidden = true;
            if (add) add.setAttribute("aria-expanded", "false");
        }
        const link = event.target.closest("a");
        if (!link) return;
        event.preventDefault();
        const raw = link.getAttribute("href") || "";
        if (raw.startsWith("#")) {
            let id;
            try { id = decodeURIComponent(raw.slice(1)); } catch (_) { id = raw.slice(1); }
            const row = link.closest("article"), target = row && Array.from(row.querySelectorAll("[id]")).find(function (node) { return node.id === id; });
            if (target) {

                requestAnimationFrame(function () { requestAnimationFrame(function () { target.scrollIntoView({ block: "nearest" }); }); });
                return;
            }
        }
        if (["https:", "http:", "mailto:"].includes(link.protocol)) post({ kind: link.dataset.external === "true" ? "browser" : "link", url: link.href });
    });
})();
</script>
</body>
</html>
